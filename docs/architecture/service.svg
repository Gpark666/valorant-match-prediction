<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 900" role="img" aria-labelledby="arch-valorant-service-title arch-valorant-service-desc">
<title id="arch-valorant-service-title">Valorant · 현재 경기 조회 서비스 아키텍처</title>
<desc id="arch-valorant-service-desc">React Native 호출 코드는 확인했고 VLR 수집기는 .pyc의 정적 문자열과 사용자 구현 이력으로 설명했다. API·수집기 사이 점선은 원문이 보존되지 않은 연결 경계다. 앱은 탭 또는 경기 변경 시 fetch하며 자동 주기 갱신이나 WebSocket은 확인되지 않았다.</desc>
